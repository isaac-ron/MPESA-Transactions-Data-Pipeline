[project]
name = "mpesa-pipeline"
version = "0.1.0"
description = "Batch pipeline for M-Pesa till exports: landing zone -> Postgres raw -> staging -> star schema, orchestrated by Airflow"
readme = "README.md"
authors = [
    { name = "Ron Isaac", email = "ronotieno@kabarak.ac.ke" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.scripts]
mpesa-pipeline = "mpesa_pipeline.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# The package lives at ./mpesa_pipeline (flat layout), not ./src/mpesa_pipeline
[tool.uv.build-backend]
module-root = ""
